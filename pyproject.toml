[project]
name = "aare-temp-menubar"
version = "0.9.0"
description = "Live Aare river temperature in your macOS menubar"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rumps>=0.4.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.scripts]
aare-menubar = "aare_menubar.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aare_menubar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pyinstaller>=6.0",
]
